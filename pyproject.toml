[project]
name = "thesis-proposed-solution"
version = "0.1.0"
description = "Control-plane-first ETL governance prototype for thesis implementation."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]
