services:
  airflow:
    image: apache/airflow:${AIRFLOW_IMAGE_TAG:-2.9.3-python3.11}
    container_name: thesis-local-airflow
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /opt/airflow
    depends_on:
      openmetadata_server:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/pipelines
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      OPENMETADATA_API_ENDPOINT: http://openmetadata_server:8585/api
      OPENMETADATA_PASSWORD: admin
      OPENMETADATA_PIPELINE_SERVICE_HOST_PORT: http://airflow:8080
      OPENMETADATA_PIPELINE_SERVICE_NAME: thesis_local_airflow
      OPENMETADATA_USERNAME: admin@open-metadata.org
      PYTHONPATH: /opt/airflow:/opt/airflow/src
    volumes:
      - .:/opt/airflow
    ports:
      - "8080:8080"
    command: standalone

  openmetadata_mysql:
    image: openmetadata/db:${OPENMETADATA_IMAGE_TAG:-1.12.6}
    container_name: thesis-openmetadata-mysql
    environment:
      MYSQL_DATABASE: openmetadata_db
      MYSQL_PASSWORD: openmetadata_password
      MYSQL_ROOT_PASSWORD: openmetadata_root_password
      MYSQL_USER: openmetadata_user
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uopenmetadata_user", "-popenmetadata_password"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - openmetadata_mysql_data:/var/lib/mysql

  openmetadata_elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    container_name: thesis-openmetadata-elasticsearch
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      xpack.security.enabled: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes:
      - openmetadata_elasticsearch_data:/usr/share/elasticsearch/data

  openmetadata_server:
    image: openmetadata/server:${OPENMETADATA_IMAGE_TAG:-1.12.6}
    container_name: thesis-openmetadata-server
    depends_on:
      openmetadata_migrate:
        condition: service_completed_successfully
    environment:
      AUTHENTICATION_AUTHORITY: http://openmetadata_server:8585
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: "[http://openmetadata_server:8585/api/v1/system/config/jwks]"
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_HOST: openmetadata_mysql
      DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_PORT: "3306"
      DB_SCHEME: mysql
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      ELASTICSEARCH_CLUSTER_ALIAS: thesis-local
      ELASTICSEARCH_HOST: openmetadata_elasticsearch
      ELASTICSEARCH_PASSWORD: ""
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USER: ""
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/8585'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    ports:
      - "8585:8585"
      - "8586:8586"

  openmetadata_migrate:
    image: openmetadata/server:${OPENMETADATA_IMAGE_TAG:-1.12.6}
    container_name: thesis-openmetadata-migrate
    depends_on:
      openmetadata_mysql:
        condition: service_healthy
      openmetadata_elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: ["cd /opt/openmetadata && ./bootstrap/openmetadata-ops.sh migrate"]
    environment:
      AUTHENTICATION_AUTHORITY: http://openmetadata_server:8585
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: "[http://openmetadata_server:8585/api/v1/system/config/jwks]"
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_HOST: openmetadata_mysql
      DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_PORT: "3306"
      DB_SCHEME: mysql
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      ELASTICSEARCH_CLUSTER_ALIAS: thesis-local
      ELASTICSEARCH_HOST: openmetadata_elasticsearch
      ELASTICSEARCH_PASSWORD: ""
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USER: ""
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
    restart: "no"

volumes:
  openmetadata_elasticsearch_data:
  openmetadata_mysql_data:
